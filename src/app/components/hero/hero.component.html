<section class="hero-section" id="hero">
    <div class="hero-container">
        <div class="hero-text" data-aos="fade-right">
            <h1>{{ "home.hero.greeting.hi" | translate}} <span class="my_name"> {{ "home.hero.greeting.my_name" |
                    translate}} </span> <br>
                {{ "home.hero.greeting.and" | translate}}<br>
                <span class="highlight">{{ "home.hero.greeting.fullstack" | translate}}</span><br>
            </h1>

            <figure class="img-solo-mobole">
                <img src="assets/hero/Greeting-photo.png" alt="Jesus Diaz Photo">
            </figure>

            <div class="buttons-container">
                <a href="#contact">
                    <button class="primary-button">{{ "home.hero.btn_contact" | translate}}</button>
                </a>
                <!-- TODO: put an spinner here -->
                <a [href]="cvUrl">
                    <button class="primary-button">{{ "home.hero.btn_download_cv" | translate}}</button>
                </a>
            </div>
        </div>
        <figure data-aos="fade-left">
            <img src="assets/hero/Greeting-photo.png" alt="Jesus Diaz Photo">
        </figure>
    </div>
    <figure class="icons-container">
        <a href="https://github.com/jesusdiaz-dev" target="_blank"><img src="assets/icons/github.svg"
                alt="github icon"></a>
        <a href="https://www.linkedin.com/in/jesusdiaz-dev/" target="_blank"><img src="assets/icons/linkedin.svg"
                alt="linkedin icon"></a>
    </figure>
</section>
